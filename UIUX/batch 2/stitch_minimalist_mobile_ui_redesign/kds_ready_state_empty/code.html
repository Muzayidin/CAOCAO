<script>
        function handleSync() {
            const btn = document.getElementById('sync-btn');
            const icon = document.getElementById('sync-icon');
            const originalContent = btn.innerHTML;
            
            // Visual feedback
            icon.classList.add('animate-spin');
            btn.classList.add('opacity-80', 'pointer-events-none');
            
            // Mock sync delay
            setTimeout(() => {
                icon.classList.remove('animate-spin');
                btn.classList.remove('opacity-80', 'pointer-events-none');
                
                // Show brief success state
                const span = btn.querySelector('span:last-child');
                const originalText = span.textContent;
                span.textContent = 'Updated';
                
                setTimeout(() => {
                    span.textContent = originalText;
                }, 2000);
            }, 1200);
        }

        // Add glassmorphism variation to background based on mouse movement (very subtle)
        document.addEventListener('mousemove', (e) => {
            const main = document.querySelector('main');
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            
            const gradientX = x * 10;
            const gradientY = y * 10;
            
            main.style.background = `radial-gradient(circle at ${50 + gradientX}% ${50 + gradientY}%, rgba(229, 225, 222, 0.1) 0%, transparent 80%)`;
        });
    </script>
