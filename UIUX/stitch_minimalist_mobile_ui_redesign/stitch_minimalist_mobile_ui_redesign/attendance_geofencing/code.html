<script>
        // Update Time
        function updateTime() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const dateStr = now.toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' });
            document.getElementById('current-time').innerText = `${timeStr} • ${dateStr}`;
        }
        setInterval(updateTime, 1000);
        updateTime();

        // QR Timer Animation
        let timeLeft = 60;
        const totalTime = 60;
        const circle = document.getElementById('timer-circle');
        const counter = document.getElementById('seconds-counter');
        const radius = 48;
        const circumference = 2 * Math.PI * radius;

        function animateTimer() {
            if (timeLeft <= 0) {
                timeLeft = 60;
                // Imagine QR code refresh logic here
            }
            
            const offset = circumference - (timeLeft / totalTime) * circumference;
            circle.style.strokeDashoffset = offset;
            
            // Color Transition
            if (timeLeft > 30) {
                circle.style.stroke = '#4B5320'; // Olive
            } else if (timeLeft > 10) {
                circle.style.stroke = '#5a632e'; // Secondary
            } else {
                circle.style.stroke = '#ba1a1a'; // Error Red
            }

            counter.innerText = `Refreshing in ${timeLeft}s`;
            timeLeft--;
        }

        setInterval(animateTimer, 1000);
        animateTimer();
    </script>
