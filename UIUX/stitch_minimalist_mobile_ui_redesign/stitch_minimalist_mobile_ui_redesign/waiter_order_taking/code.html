</nav>
<script>
        const sheet = document.getElementById('bottomSheet');
        const overlay = document.getElementById('sheetOverlay');
        const cartBar = document.getElementById('cartBar');
        let isSheetOpen = false;

        function toggleSheet() {
            isSheetOpen = !isSheetOpen;
            if (isSheetOpen) {
                sheet.classList.remove('translate-y-full');
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.add('opacity-100'), 10);
                cartBar.classList.add('translate-y-24');
            } else {
                sheet.classList.add('translate-y-full');
                overlay.classList.remove('opacity-100');
                setTimeout(() => {
                    overlay.classList.add('hidden');
                }, 300);
                cartBar.classList.remove('translate-y-24');
            }
        }

        function addToCart(name, price) {
            // Visual feedback
            const btn = event.currentTarget;
            btn.innerHTML = '<span class="material-symbols-outlined animate-ping">done</span>';
            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined">add</span>';
            }, 600);

            // Update UI
            const countEl = document.getElementById('cartCount');
            const totalEl = document.getElementById('cartTotal');
            let count = parseInt(countEl.innerText);
            let total = parseFloat(totalEl.innerText.replace('$', ''));
            
            countEl.innerText = count + 1;
            totalEl.innerText = `$${(total + price).toFixed(2)}`;
            
            // Pulse animation for bar
            cartBar.classList.add('scale-105');
            setTimeout(() => cartBar.classList.remove('scale-105'), 200);
        }
    </script>
</body></html>
